server:
  port: ${SERVER_PORT:8082}
  forward-headers-strategy: framework
spring:
  application:
    name: sonantv1
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASS}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:create-drop}
    show-sql: ${JPA_SHOW_SQL:true}